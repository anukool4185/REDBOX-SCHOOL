<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDBOX SCHOOL | กล่องแดงถึงครูฝ่ายกิจการนักเรียน</title>
<style>
  :root{ --red:#d92027; --dark:#1b1b1f; --line:#e6e6ea; }
  *{box-sizing:border-box;font-family:"Sarabun","Segoe UI",sans-serif}
  body{margin:0;background:#f4f5f7;color:var(--dark)}
  header{background:var(--red);color:#fff;padding:26px 20px;text-align:center}
  header h1{margin:0;font-size:26px;letter-spacing:1px}
  header p{margin:6px 0 0;opacity:.9;font-size:14px}
  .wrap{max-width:640px;margin:-24px auto 40px;padding:0 16px}
  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
  input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;outline:none;background:#fff}
  input:focus,select:focus,textarea:focus{border-color:var(--red)}
  textarea{min-height:120px;resize:vertical}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .hint{font-size:12px;color:#777;margin-top:4px}
  button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;
    background:var(--red);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;padding:12px;border-radius:10px;font-size:14px;display:none}
  .ok{background:#e7f7ed;color:#1a7f43}.err{background:#fdecec;color:#b3261e}
  .err-txt{color:var(--red);font-size:12px;min-height:15px}
</style>
</head>
<body>
<header>
  <h1>🟥 REDBOX SCHOOL</h1>
  <p>กล่องรับเรื่อง — ส่งถึงครูฝ่ายกิจการนักเรียนโดยตรง</p>
</header>

<div class="wrap">
  <form class="card" id="redboxForm" novalidate>
    <div class="row">
      <div>
        <label for="fullname">ชื่อ-นามสกุล *</label>
        <input id="fullname" name="fullname" placeholder="เช่น สมชาย ใจดี">
        <div class="err-txt" id="e-fullname"></div>
      </div>
      <div>
        <label for="studentId">รหัสนักเรียน *</label>
        <input id="studentId" name="studentId" placeholder="เช่น 65012345" inputmode="numeric">
        <div class="err-txt" id="e-studentId"></div>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="level">ระดับชั้น *</label>
        <select id="level" name="level">
          <option value="">-- เลือก --</option>
          <option>ม.1</option><option>ม.2</option><option>ม.3</option>
          <option>ม.4</option><option>ม.5</option><option>ม.6</option>
        </select>
        <div class="err-txt" id="e-level"></div>
      </div>
      <div>
        <label for="room">ห้อง *</label>
        <input id="room" name="room" placeholder="เช่น 4">
        <div class="err-txt" id="e-room"></div>
      </div>
    </div>

    <label for="phone">เบอร์ติดต่อ *</label>
    <input id="phone" name="phone" placeholder="0812345678" inputmode="tel" maxlength="10">
    <div class="err-txt" id="e-phone"></div>

    <label for="topic">ประเภทเรื่องที่แจ้ง *</label>
    <select id="topic" name="topic">
      <option value="">-- เลือกประเภท --</option>
      <option>ขออนุญาต / ลากิจ-ลาป่วย</option>
      <option>แจ้งปัญหาพฤติกรรมนักเรียน</option>
      <option>แจ้งเหตุกลั่นแกล้ง (Bullying)</option>
      <option>ขอคำปรึกษาส่วนตัว</option>
      <option>แจ้งของหาย / ทรัพย์สินเสียหาย</option>
      <option>เสนอแนะ / ร้องเรียน</option>
      <option>อื่น ๆ</option>
    </select>
    <div class="err-txt" id="e-topic"></div>

    <label for="message">รายละเอียด *</label>
    <textarea id="message" name="message" placeholder="เล่าเหตุการณ์ วัน-เวลา สถานที่ และสิ่งที่ต้องการให้ช่วยเหลือ"></textarea>
    <div class="hint">อย่างน้อย 10 ตัวอักษร</div>
    <div class="err-txt" id="e-message"></div>

    <label style="font-weight:500;margin-top:16px">
      <input type="checkbox" id="anonymous" style="width:auto;margin-right:6px">
      ขอปกปิดชื่อผู้แจ้ง (ครูจะเห็นเฉพาะรหัสอ้างอิง)
    </label>

    <button type="submit" id="btn">ส่งเรื่องเข้ากล่องแดง</button>
    <div class="msg" id="result"></div>
  </form>
</div>

<script>
// 🔧 วาง URL ของ Google Apps Script (Deploy > Web app) ตรงนี้
const API_URL = "https://script.google.com/macros/s/XXXXXXXX/exec";

const form = document.getElementById("redboxForm");
const btn  = document.getElementById("btn");
const box  = document.getElementById("result");

const rules = {
  fullname : v => v.trim().length >= 3            || "กรุณากรอกชื่อ-นามสกุล",
  studentId: v => /^\d{4,10}$/.test(v.trim())     || "รหัสนักเรียนต้องเป็นตัวเลข 4-10 หลัก",
  level    : v => v !== ""                        || "กรุณาเลือกระดับชั้น",
  room     : v => v.trim() !== ""                 || "กรุณากรอกห้อง",
  phone    : v => /^0\d{9}$/.test(v.trim())       || "เบอร์โทรต้องเป็นตัวเลข 10 หลัก ขึ้นต้น 0",
  topic    : v => v !== ""                        || "กรุณาเลือกประเภทเรื่อง",
  message  : v => v.trim().length >= 10           || "กรุณากรอกรายละเอียดอย่างน้อย 10 ตัวอักษร"
};

function validate(){
  let ok = true;
  for (const key in rules){
    const res = rules[key](form[key].value);
    const el  = document.getElementById("e-" + key);
    el.textContent = res === true ? "" : res;
    if (res !== true) ok = false;
  }
  return ok;
}

function ticketId(){
  return "RB" + Date.now().toString(36).toUpperCase().slice(-6)
       + Math.floor(Math.random()*90+10);
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  box.style.display = "none";
  if (!validate()) return;

  const payload = {
    ticket    : ticketId(),
    fullname  : form.fullname.value.trim(),
    studentId : form.studentId.value.trim(),
    level     : form.level.value,
    room      : form.room.value.trim(),
    phone     : form.phone.value.trim(),
    topic     : form.topic.value,
    message   : form.message.value.trim(),
    anonymous : document.getElementById("anonymous").checked,
    createdAt : new Date().toLocaleString("th-TH")
  };

  btn.disabled = true; btn.textContent = "กำลังส่ง...";
  try {
    await fetch(API_URL, {
      method : "POST",
      mode   : "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body   : JSON.stringify(payload)
    });
    box.className = "msg ok";
    box.innerHTML = `✅ ส่งเรื่องเรียบร้อย<br>รหัสติดตาม: <b>${payload.ticket}</b><br>
                     กรุณาบันทึกรหัสนี้ไว้เพื่อสอบถามความคืบหน้า`;
    form.reset();
  } catch (err) {
    box.className = "msg err";
    box.textContent = "❌ ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
  }
  box.style.display = "block";
  btn.disabled = false; btn.textContent = "ส่งเรื่องเข้ากล่องแดง";
});
</script>
</body>
</html>
